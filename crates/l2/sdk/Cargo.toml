[package]
name = "reec-sdk"
version.workspace = true
edition.workspace = true

[dependencies]
reec-l2.workspace = true
reec-core.workspace = true
reec-rpc.workspace = true

ethereum-types.workspace = true
tokio.workspace = true
hex.workspace = true
keccak-hash = "0.11.0"
