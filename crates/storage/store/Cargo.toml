[package]
name = "reec-storage"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reec-rlp.workspace = true
reec-core = { path = "../../common", default-features = false }
reec-trie = { path = "../../storage/trie", default-features = false }

ethereum-types = "0.14.1"
anyhow = "1.0.86"
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
sha3.workspace = true
hex.workspace = true
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
libmdbx = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[features]
default = []
libmdbx = [
    "dep:libmdbx",
    "reec-trie/libmdbx",
    "reec-core/libmdbx",
]
redb = [
    "dep:redb",
    "reec-trie/redb",
    "reec-core/redb"
]

[dev-dependencies]
hex.workspace = true
hex-literal.workspace = true

[lib]
path = "./storage.rs"
