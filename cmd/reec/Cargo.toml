[package]
name = "reec"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reec-blockchain.workspace = true
reec-rpc.workspace = true
reec-core.workspace = true
reec-net.workspace = true
reec-storage = { workspace = true, optional = true }
reec-vm.workspace = true
reec-rlp.workspace = true
reec-l2 = { workspace = true, optional = true }

bytes.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
k256.workspace = true
clap = { version = "4.5.4", features = ["cargo"] }
directories = "5.0.1"
serde_json.workspace = true
tokio = { version = "1.38.0", features = ["full"] }
anyhow = "1.0.86"
rand = "0.8.5"
local-ip-address = "0.6"
tokio-util.workspace = true
libmdbx = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

cfg-if = "1.0.0"

reec-dev = { path = "../../crates/blockchain/dev", optional = true }

[[bin]]
name = "reec"
path = "./reec.rs"

[features]
default = ["dep:reec-storage", "libmdbx"]
dev = ["dep:reec-dev"]
libmdbx = ["dep:libmdbx", "reec-storage/libmdbx"]
redb = ["dep:redb", "reec-storage/redb"]
l2 = ["dep:reec-l2", "reec-vm/l2"]
levm = ["default", "reec-vm/levm", "reec-blockchain/levm"]