[workspace]
members = [
    "crates/blockchain",
    "crates/core",
    "crates/net", 
    "crates/rpc",
    "crates/storage",
    "crates/evm",
    "cmd/reec", 
    "cmd/ef_tests",
]
resolver = "2"
default-members = ["cmd/reec"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
reec-blockchain = { path = "./crates/blockchain"}
reec-core = { path = "./crates/core" }
reec-net = { path = "./crates/net" }
reec-rpc = { path = "./crates/rpc" }
reec-storage = { path = "./crates/storage" }
reec-evm = { path = "./crates/evm" }

ethereum-types = "0.14.1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3.0"
serde = {version = "1.0.203", features = ["derive"]}
serde_json = "1.0.117"
libmdbx = { version = "0.4.0", features = ["orm"] }
bytes = { version = "1.6.0", features = ["serde"] }
tokio = { version = "1.38.0", features = ["full"] }
thiserror = "1.0.61"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.5.0"
sha3 = "0.10.8"

