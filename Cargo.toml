[workspace]
members = [
    "crates/storage",
    "crates/core",
    "crates/rpc",
    "crates/consensus",
    "crates/net",
    "crates/evm", 
    "reec",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
consensus = { path = "./crates/consesnsus"}
core = { path = "./crates/core" }
evm = { path = "./crates/evm" }
net = { path = "./crates/net" }
rpc = { path = "./crates/rpc" }
storage = { path = "./crates/storage" }

ethereum-types = "0.14.1"
tracing = "0.1"
tracing-subscriber = "0.3.0"
serde = {version = "1.0.203", features = ["derive"]}
serde_json = "1.0.117"
libmdbx = { version = "0.4.0", features = ["orm"] }
tokio = { version = "1.38.0", features = ["full"] }

